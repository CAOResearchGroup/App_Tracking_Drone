[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-multi-drone"
version = "0.1.0"
description = "Centralized PX4 leader-follower control CLI"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
mavlink = ["pymavlink>=2.4.49,<3"]
plots = ["PySide6>=6.8,<7", "pyqtgraph>=0.13.7,<0.15"]

[project.scripts]
fleet = "multi_drone.ui:main"

[tool.setuptools.packages.find]
where = ["src"]
